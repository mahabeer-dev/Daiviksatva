<!doctype html>
<!--
  Source for public/og-image.jpg (the link preview on WhatsApp, Facebook, LinkedIn, X).
  Regenerate after editing:  npm run og
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&family=Manrope:wght@500;600;700&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --cream: #f6f0e6;
        --ivory: #fbf8f2;
        --sand: #ece2d0;
        --forest: #173a2e;
        --forest-deep: #10281f;
        --turmeric: #e2a54a;
        --saffron: #a9671c;
        --muted: #5b675f;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        background: var(--cream);
        font-family: Manrope, system-ui, sans-serif;
        color: var(--forest);
      }
      .wash-a { position: absolute; left: -160px; top: -120px; width: 620px; height: 620px; border-radius: 50%; background: rgb(143 163 130 / 0.28); filter: blur(90px); }
      .wash-b { position: absolute; left: 380px; bottom: -260px; width: 520px; height: 520px; border-radius: 50%; background: rgb(226 165 74 / 0.28); filter: blur(100px); }

      .copy { position: absolute; left: 72px; top: 62px; width: 600px; }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand svg { width: 40px; height: 40px; color: var(--saffron); }
      .brand span { font-family: Fraunces, serif; font-size: 32px; letter-spacing: -0.01em; }
      .brand em { color: var(--saffron); }

      h1 {
        margin-top: 46px;
        font-family: Fraunces, serif;
        font-weight: 300;
        font-size: 84px;
        line-height: 0.98;
        letter-spacing: -0.035em;
      }
      h1 em { color: var(--saffron); }

      .sub { margin-top: 26px; font-size: 23px; line-height: 1.4; color: var(--muted); font-weight: 500; }

      .row { position: absolute; left: 72px; bottom: 58px; display: flex; gap: 12px; }
      .pill {
        display: inline-flex; align-items: center; gap: 9px;
        height: 50px; padding: 0 22px; border-radius: 999px;
        font-size: 19px; font-weight: 700;
      }
      .pill.dark { background: var(--forest); color: var(--cream); }
      .pill.dark b { color: var(--turmeric); }
      .pill.line { border: 1.5px solid rgb(23 58 46 / 0.18); background: rgb(251 248 242 / 0.7); }
      .pill svg { width: 20px; height: 20px; }

      .arch {
        position: absolute; right: 64px; top: 46px;
        width: 420px; height: 620px;
        border-radius: 210px 210px 0 0;
        overflow: hidden;
        background: var(--sand);
        box-shadow: 0 40px 80px -40px rgb(23 58 46 / 0.6);
      }
      .arch img { width: 100%; height: 100%; object-fit: cover; object-position: 32% 50%; }
      .arch::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgb(16 40 31 / 0.45), transparent 45%); }

      .badge {
        position: absolute; right: 340px; top: 360px; z-index: 2;
        display: flex; align-items: center; gap: 14px;
        padding: 16px 20px; border-radius: 22px;
        background: rgb(251 248 242 / 0.94);
        border: 1px solid rgb(23 58 46 / 0.1);
        box-shadow: 0 24px 50px -22px rgb(23 58 46 / 0.55);
      }
      .badge .stars { display: flex; gap: 3px; color: var(--turmeric); }
      .badge .stars svg { width: 20px; height: 20px; }
      .badge strong { font-family: Fraunces, serif; font-weight: 400; font-size: 34px; line-height: 1; }
      .badge small { display: block; margin-top: 4px; font-size: 15px; color: var(--muted); font-weight: 600; }

      .ring {
        position: absolute; right: 18px; top: 18px; z-index: 2;
        width: 150px; height: 150px; border-radius: 50%;
        display: grid; place-items: center;
        background: var(--forest); color: var(--turmeric);
        box-shadow: 0 20px 40px -18px rgb(16 40 31 / 0.7);
      }
      .ring svg.text { position: absolute; inset: 8px; width: calc(100% - 16px); height: calc(100% - 16px); color: rgb(246 240 230 / 0.85); }
      .ring svg.mark { width: 48px; height: 48px; }
    </style>
  </head>
  <body>
    <div class="wash-a"></div>
    <div class="wash-b"></div>

    <div class="copy">
      <div class="brand">
        <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
          <path d="M16 4c3.8 4.6 3.8 11.6 0 18-3.8-6.4-3.8-13.4 0-18z" />
          <path d="M15.3 22.6C10 21.2 6.2 17 5.3 11.6c4.9.6 8.6 4.6 10 11z" />
          <path d="M16.7 22.6c5.3-1.4 9.1-5.6 10-11-4.9.6-8.6 4.6-10 11z" />
          <path d="M7 26.5h18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
        </svg>
        <span>Daivik<em>satva</em></span>
      </div>
      <h1>Heal from<br />the root,<br /><em>naturally.</em></h1>
      <p class="sub">Ayurveda, diet &amp; yoga for chronic and<br />autoimmune care, guided by doctors who listen.</p>
    </div>

    <div class="row">
      <span class="pill dark">Book a consultation <b>→</b></span>
      <span class="pill line">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 18s5.5-5.2 5.5-9.5a5.5 5.5 0 0 0-11 0C4.5 12.8 10 18 10 18z" /><circle cx="10" cy="8.5" r="2" /></svg>
        Sector 78, Mohali
      </span>
    </div>

    <div class="arch">
      <img
        src="https://images.unsplash.com/photo-1775133263714-848c8fe09e73?auto=format&fit=crop&w=900&q=85"
        alt=""
      />
    </div>

    <div class="badge">
      <div>
        <div class="stars">
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="m10 1.8 2.5 5.2 5.7.8-4.1 4 1 5.6L10 14.7l-5.1 2.7 1-5.6-4.1-4 5.7-.8z" /></svg>
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="m10 1.8 2.5 5.2 5.7.8-4.1 4 1 5.6L10 14.7l-5.1 2.7 1-5.6-4.1-4 5.7-.8z" /></svg>
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="m10 1.8 2.5 5.2 5.7.8-4.1 4 1 5.6L10 14.7l-5.1 2.7 1-5.6-4.1-4 5.7-.8z" /></svg>
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="m10 1.8 2.5 5.2 5.7.8-4.1 4 1 5.6L10 14.7l-5.1 2.7 1-5.6-4.1-4 5.7-.8z" /></svg>
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="m10 1.8 2.5 5.2 5.7.8-4.1 4 1 5.6L10 14.7l-5.1 2.7 1-5.6-4.1-4 5.7-.8z" /></svg>
        </div>
        <small>11 reviews on Google</small>
      </div>
      <strong>5.0</strong>
    </div>

    <div class="ring">
      <svg class="text" viewBox="0 0 100 100" aria-hidden="true">
        <defs><path id="r" d="M50 50m-38 0a38 38 0 1 1 76 0a38 38 0 1 1-76 0" /></defs>
        <text fill="currentColor" font-family="Manrope" font-weight="700" font-size="8.6" letter-spacing="2.1">
          <textPath href="#r">AYURVEDA · YOGA · DIET · HEALING ·</textPath>
        </text>
      </svg>
      <svg class="mark" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
        <path d="M16 4c3.8 4.6 3.8 11.6 0 18-3.8-6.4-3.8-13.4 0-18z" />
        <path d="M15.3 22.6C10 21.2 6.2 17 5.3 11.6c4.9.6 8.6 4.6 10 11z" />
        <path d="M16.7 22.6c5.3-1.4 9.1-5.6 10-11-4.9.6-8.6 4.6-10 11z" />
      </svg>
    </div>
  </body>
</html>
